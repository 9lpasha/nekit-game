<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Двое в лодке — отладка на двоих</title>
  <style>
    body { margin: 0; background: #111; display: flex; gap: 16px; justify-content: center; padding: 16px; font: 13px system-ui; color: #ccc; }
    figure { margin: 0; text-align: center; }
    iframe { width: 390px; height: 760px; border: 2px solid #333; border-radius: 16px; background: #000; }
  </style>
</head>
<body>
  <!-- Два «телефона» в одном окне.
       dev.html          — связь через BroadcastChannel, интернет не нужен;
       dev.html?net=p2p  — настоящий WebRTC через Trystero (нужен интернет);
       dev.html?island=60 — короткий путь до острова. -->
  <figure><iframe id="host"></iframe><figcaption>Хост (оранжевый)</figcaption></figure>
  <figure><iframe id="guest"></iframe><figcaption>Гость (синий)</figcaption></figure>
  <script>
    const q = new URLSearchParams(location.search);
    const p2p = q.get('net') === 'p2p';
    q.delete('net');
    const code = p2p ? 'D' + Math.random().toString(36).slice(2, 5).toUpperCase() : 'TEST';
    const net = p2p ? '' : 'net=local&';
    const extra = q.toString() ? '&' + q : ''; // например ?island=60 — пробрасываем в оба окна
    document.getElementById('host').src = `index.html?${net}auto=host&code=${code}${extra}`;
    document.getElementById('guest').src = `index.html?${net}auto=guest&code=${code}${extra}`;
  </script>
</body>
</html>
